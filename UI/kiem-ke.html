    .step .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 11px; background: #fff; }
    .step.done .dot { background: var(--green-800); border-color: var(--green-800); color: #fff; }
    .step.cur { color: var(--ink); } .step.cur .dot { border-color: var(--green-800); color: var(--green-800); }
    .step-line { width: 48px; height: 1.5px; background: var(--line); margin: 0 10px; }
    .step-line.done { background: var(--green-800); }
  </style>
</head>
